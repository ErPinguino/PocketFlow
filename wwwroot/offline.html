<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin Conexión - PocketFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: system-ui, -apple-system, sans-serif; text-align: center; }
        .icon { font-size: 5rem; color: #6c757d; margin-bottom: 1rem; }
        .btn-primary { background-color: #3B82F6; border: none; padding: 12px 24px; border-radius: 50px; font-weight: bold; margin-top: 2rem; }
    </style>
</head>
<body>
    <div class="p-4">
        <i class="bi bi-wifi-off icon"></i>
        <h2 class="fw-bold mb-3">Estás desconectado</h2>
        <p class="text-muted">No hemos podido conectar con los servidores de PocketFlow.</p>
        <p class="text-muted small">Comprueba tu conexión a internet e inténtalo de nuevo.</p>
        <button onclick="window.location.reload()" class="btn btn-primary shadow-sm">
            <i class="bi bi-arrow-clockwise me-1"></i> Reintentar
        </button>
    </div>
</body>
</html>
